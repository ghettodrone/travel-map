
<header class="header">
  <div class="header__title">
    <span class="header__eyebrow">TELL ME ABOUT YOUR JOURNEY</span>
    <h1>Dashboard</h1>
  </div>

  <div class="header__actions">
    <button class="header__icon-button" aria-label="Notifications" [pTooltip]="'Notifications'" tooltipPosition="top">
      <i class="pi pi-bell"></i>
    </button>
    <button class="header__icon-button" aria-label="Language" [pTooltip]="'Change the language'" tooltipPosition="top">
      <i class="pi pi-language" ></i>
    </button>

    <div class="header__profile ml-3">
      <div class="header__avatar">A</div>

      <div class="header__user-info">
        <span class="header__user-name">Andrey</span>
        <span class="header__user-role">Traveler</span>
      </div>

      <i class="pi pi-chevron-down"></i>
    </div>
  </div>
</header>
